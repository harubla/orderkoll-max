(function(){try{

  var dark = t==='dark' || (t==='system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(dark) document.documentElement.classList.add('dark');
}catch(e){}})();
</script>

<style>
  html { scrollbar-color: #a3a3a3 transparent; }
  body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; }
  ::selection { background: rgba(99,102,241,.25); }

  /* Påmint kort-puls */
  @keyframes remindPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,.45);} 50% { box-shadow: 0 0 0 6px rgba(244,63,94,0);} }
  .remind-flash { animation: remindPulse 1.4s ease-in-out infinite; border-color: rgba(244,63,94,.6) !important; }

  /* Maskot */
  #mascot { transform: translateY(135%); opacity: 0; transition: transform .5s cubic-bezier(.34,1.4,.64,1), opacity .4s; }
  #mascot.show { transform: translateY(0); opacity: 1; }
  #mascotBubble { transform: scale(0); transition: transform .3s cubic-bezier(.34,1.56,.64,1) .15s; }
  #mascot.show #mascotBubble { transform: scale(1); }
  #mascotArm { transition: transform .4s cubic-bezier(.34,1.56,.64,1) .1s; }
  #mascot.show #mascotArm { transform: rotate(-155deg); }
  #mascot.show svg { animation: hop .55s ease .1s 2; }
  @keyframes hop { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-16px)} 70%{transform:translateY(-4px)} }

  /* Nivå-banner */
  #levelBanner { opacity: 0; pointer-events: none; }
  #levelBanner.show { animation: bannerIn 2.8s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes bannerIn {
    0% { opacity:0; transform: translate(-50%,-30px) scale(.8); }
    12% { opacity:1; transform: translate(-50%,0) scale(1.05); }
    18% { transform: translate(-50%,0) scale(1); }
    80% { opacity:1; transform: translate(-50%,0) scale(1); }
    100% { opacity:0; transform: translate(-50%,-20px) scale(.95); }
  }

  /* Toast */
  .toast { animation: toastIn .25s cubic-bezier(.22,1,.36,1); }
  @keyframes toastIn { from { opacity:0; transform: translateY(12px) scale(.96);} to {opacity:1; transform:none;} }
  .toast.out { opacity:0; transform: translateY(8px); transition: all .25s; }

  /* Modal/drawer */
  .modal-card { animation: modalIn .22s cubic-bezier(.22,1,.36,1); }
  @keyframes modalIn { from { opacity:0; transform: translateY(14px) scale(.97);} to {opacity:1; transform:none;} }

  @keyframes copiedFlash { 0% { transform: scale(1);} 40% { transform: scale(1.12);} 100% { transform: scale(1);} }

  kbd { font-family: ui-monospace, monospace; }
</style>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
/* =================================================================
   OrderPrio – all applikationslogik (lokalt först, Firebase-synk)
================================================================= */
const App = (() => {
  const LS = { cards:'op.cards.v1', settings:'op.settings.v1', stats:'op.stats.v1' };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e){ return d; } };
  const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  /* ---------- State ---------- */
  let cards = load(LS.cards, []);
  let settings = Object.assign({
    volume: 0.7, sound: 'chime', delivery: 'page', mascot: true,
    theme: 'system', view: 'split', lastPrio: 'high', lastRemind: 60
  }, load(LS.settings, {}));
  let stats = Object.assign({ totalDone: 0 }, load(LS.stats, {}));
  let ui = { filter:'all', query:'', composerOpen:false, doneOpen:false, editingId:null, sortDesc:true, composerPrio:null, composerRemind:null };
  let localStamp = load('op.stamp.v1', 0);
  let lastDeleted = null, syncTimer = null, authUser = null, syncMsgShown = false;

  const level = () => Math.floor(stats.totalDone / 3) + 1;
  const activeCards = () => cards.filter(c => c.status !== 'done');
  const doneCards = () => cards.filter(c => c.status === 'done');

  function commit(opts={}) {
    save(LS.cards, cards); save(LS.settings, settings); save(LS.stats, stats);
    if (opts.stamp !== false) { localStamp = Date.now(); save('op.stamp.v1', localStamp); }
    render();
    schedulePush();
  }
  function schedulePush() {
    if (!authUser || !window.Sync) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => window.Sync.push(), 900);
  }

  /* ---------- Ljud (WebAudio) ---------- */
  let actx = null;
  function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
  function tone(f, t=0, d=.2, type='sine', v=1, slideTo=null){
    try {
      const ctx = ac(), o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, ctx.currentTime + t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + t + d);
      g.gain.setValueAtTime(.0001, ctx.currentTime + t);
      g.gain.linearRampToValueAtTime(Math.max(.0001, v * settings.volume), ctx.currentTime + t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + d);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + d + .05);
    } catch(e){}
  }
  const SOUNDS = {
    chime: { name:'Klocka', desc:'Mjuk tvåtons klocka', play(){ tone(659,.0,.55,'sine',.9); tone(988,.13,.7,'sine',.8); tone(1319,.13,.5,'sine',.25); } },
    ping:  { name:'Ping', desc:'Korta diskreta pling', play(){ tone(1047,0,.16,'sine',1); tone(1047,.22,.22,'sine',.9); } },
    alarm: { name:'Larm', desc:'Tydlig tretone-signal', play(){ tone(587,0,.14,'square',.5); tone(587,.18,.14,'square',.5); tone(880,.36,.3,'square',.5); } },
    flute: { name:'Flöjt', desc:'Glad liten melodi', play(){ tone(523,0,.14,'triangle',.9); tone(659,.13,.14,'triangle',.9); tone(784,.26,.14,'triangle',.9); tone(1047,.39,.32,'triangle',.9); } },
  };
  const playReminder = () => { SOUNDS[settings.sound].play(); setTimeout(()=>SOUNDS[settings.sound].play(), 1000); };
  const playDone = () => { tone(523,0,.12,'triangle',.9); tone(659,.09,.12,'triangle',.9); tone(784,.18,.12,'triangle',.9); tone(1047,.27,.34,'triangle',1); };
  const playLevelUp = () => { tone(392,0,.14,'triangle',.9); tone(523,.12,.14,'triangle',.9); tone(659,.24,.14,'triangle',.9); tone(784,.36,.16,'triangle',.9); tone(1047,.5,.55,'triangle',1); tone(1319,.5,.55,'sine',.4); };
  const playCheer = () => { tone(700,0,.15,'sine',.8,1400); tone(900,.14,.16,'sine',.7,1600); tone(1200,.3,.2,'sine',.6,1800); };

  /* ---------- Konfetti ---------- */
  function confettiDone(){
    if (typeof confetti === 'undefined') return;
    const base = { particleCount: 80, spread: 65, startVelocity: 45, colors:['#22c55e','#3b82f6','#eab308','#ec4899'], zIndex: 200 };
    confetti(Object.assign({}, base, { angle: 60, origin:{ x: 0, y: .72 } }));
    confetti(Object.assign({}, base, { angle: 120, origin:{ x: 1, y: .72 } }));
  }
  function confettiLevelUp(){
    if (typeof confetti === 'undefined') return;
    const colors = ['#f59e0b','#f43f5e','#8b5cf6','#06b6d4','#facc15'];
    confetti({ particleCount: 220, spread: 100, origin:{ x:.5, y:.4 }, colors, scalar: 1.15, zIndex: 200 });
    const end = Date.now() + 1200;
    (function frame(){
      confetti({ particleCount: 6, angle: 60, spread: 60, origin:{ x:0, y:.6 }, colors, zIndex: 200 });
      confetti({ particleCount: 6, angle: 120, spread: 60, origin:{ x:1, y:.6 }, colors, zIndex: 200 });
      confetti({ particleCount: 4, spread: 120, origin:{ x: Math.random(), y: .2 }, startVelocity: 30, gravity: .9, colors, zIndex: 200 });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  /* ---------- Maskot ---------- */
  const CHEERS = ['Snyggt jobbat!','Där satt den!','Du rullar på!','Toppeninsats!','Ännu en klar!','Starkt kämpat!','Kung av ordrar!','Imponerande tempo!'];
  let mascotTimer = null;
  function showMascot(){
    if (!settings.mascot) return;
    $('#mascotBubble').textContent = CHEERS[Math.floor(Math.random()*CHEERS.length)];
    const m = $('#mascot');
    m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
    playCheer();
    clearTimeout(mascotTimer);
    mascotTimer = setTimeout(()=>m.classList.remove('show'), 3600);
  }

  /* ---------- Nivåsystem ---------- */
  const LEVEL_MSGS = ['Tempot ökar – fortsätt så!','Du är på riktig gång idag.','Imponerande produktivitet!','Ordrarna bara flyger iväg.','Mäktig insats – ta en stolt paus.','Du är ostoppbar nu!'];
  function checkLevelUp(){
    if (stats.totalDone > 0 && stats.totalDone % 3 === 0) {
      const lv = level();
      $('#levelBannerNum').textContent = 'Nivå ' + lv;
      $('#levelBannerMsg').textContent = stats.totalDone + ' avklarade totalt · ' + LEVEL_MSGS[Math.min(Math.floor(lv/2), LEVEL_MSGS.length-1)];
      const b = $('#levelBanner');
      b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      confettiLevelUp();
      playLevelUp();
      return true;
    }
    return false;
  }

  /* ---------- Toast ---------- */
  function toast(msg, opts={}){
    const t = document.createElement('div');
    t.className = 'toast pointer-events-auto flex items-center gap-3 rounded-xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 shadow-xl px-4 py-2.5 text-sm font-medium';
    t.innerHTML = (opts.icon ? `<i data-lucide="${opts.icon}" class="h-4 w-4 ${opts.iconCls||'text-indigo-500'}"></i>` : '') +
      `<span>${esc(msg)}</span>` +
      (opts.action ? `<button class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline cursor-pointer" data-act>${esc(opts.action.label)}</button>` : '');
    if (opts.action) t.querySelector('[data-act]').onclick = () => { opts.action.fn(); dismiss(); };
    $('#toasts').appendChild(t);
    refreshIcons();
    let dismissed = false;
    const dismiss = () => { if (dismissed) return; dismissed = true; t.classList.add('out'); setTimeout(()=>t.remove(), 260); };
    setTimeout(dismiss, opts.timeout || 4200);
  }

  /* ---------- Hjälpare ---------- */
  const fmtDT = ts => new Date(ts).toLocaleString('sv-SE', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  const fmtTime = ts => new Date(ts).toLocaleTimeString('sv-SE', { hour:'2-digit', minute:'2-digit' });
  const matches = (c, q) => !q || [c.order, c.action, c.note].join(' ').toLowerCase().includes(q.toLowerCase());
  const prioColor = p => p === 'high' ? 'rose' : 'sky';
  function sortCards(list, field){
    return list.slice().sort((a,b) => ui.sortDesc ? b[field]-a[field] : a[field]-b[field]);
  }
  function refreshIcons(){ try { window.lucide && lucide.createIcons(); } catch(e){} }

  /* ---------- Kort-CRUD ---------- */
  function addCard(data){
    const now = Date.now();
    const card = {
      id: uid(), order: data.order.trim(), action: data.action.trim(), note: data.note.trim(),
      status: data.prio, prevStatus: null, createdAt: now, doneAt: null,
      remindIn: data.remindIn, highSince: data.prio==='high' ? now : null,
      dueAt: data.prio==='high' ? now + data.remindIn*60000 : null,
      reminded: false
    };
    cards.unshift(card);
    settings.lastPrio = data.prio; settings.lastRemind = data.remindIn;
    commit();
    toast('Kort tillagt i ' + (data.prio==='high'?'hög':'låg') + ' prioritet', { icon:'circle-check', iconCls:'text-emerald-500' });
  }
  function updateCard(id, data){
    const c = cards.find(x=>x.id===id); if(!c) return;
    c.order = data.order.trim(); c.action = data.action.trim(); c.note = data.note.trim();
    if (c.status !== 'done') {
      if (data.prio !== c.status) moveCard(id, data.prio, true);
      c.remindIn = data.remindIn;
      if (c.status==='high') { c.dueAt = (c.highSince||Date.now()) + c.remindIn*60000; if (c.dueAt > Date.now()) c.reminded = false; }
    }
    commit();
    toast('Kort uppdaterat', { icon:'pencil', timeout: 2500 });
  }
  function deleteCard(id){
    const i = cards.findIndex(x=>x.id===id); if(i<0) return;
    lastDeleted = { card: cards[i] };
    cards.splice(i,1);
    commit();
    toast('Kort raderat', { icon:'trash-2', timeout: 6000, action:{ label:'Ångra', fn(){ cards.unshift(lastDeleted.card); commit(); } } });
  }
  function moveCard(id, to, silent){
    const c = cards.find(x=>x.id===id); if(!c || c.status===to) return;
    if (to === 'done') {
      c.prevStatus = c.status === 'done' ? (c.prevStatus||'low') : c.status;
      c.status = 'done'; c.doneAt = Date.now(); c.reminded = false;
      stats.totalDone++;
      commit();
      confettiDone(); playDone(); showMascot();
      checkLevelUp();
    } else {
      if (c.status === 'done') { // ångra avklarat
        stats.totalDone = Math.max(0, stats.totalDone - 1);
        c.doneAt = null;
      }
      c.status = to;
      if (to === 'high') { c.highSince = Date.now(); c.dueAt = Date.now() + (c.remindIn||60)*60000; c.reminded = false; }
      commit();
      if (!silent) toast('Flyttad till ' + (to==='high'?'hög':'låg') + ' prioritet', { icon:'arrow-right-left', timeout: 2500 });
    }
  }
  function undoDone(id){
    const c = cards.find(x=>x.id===id); if(!c || c.status!=='done') return;
    const back = c.prevStatus || 'low';
    moveCard(id, back, true);
    toast('Återgick till ' + (back==='high'?'hög':'låg') + ' prioritet', { icon:'rotate-ccw', timeout: 3000 });
  }
  function copyOrder(id, el){
    const c = cards.find(x=>x.id===id); if(!c) return;
    const done = () => {
      el.classList.remove('copied-flash'); void el.offsetWidth; el.classList.add('copied-flash');
      toast('Ordernummer kopierat: ' + c.order, { icon:'copy', timeout: 2000 });
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.order).then(done).catch(()=>fallbackCopy(c.order, done));
    else fallbackCopy(c.order, done);
  }
  function fallbackCopy(text, done){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); done();
  }

  /* ---------- Påminnelser ---------- */
  function dueHighCards(){
    const now = Date.now();
    return cards.filter(c => c.status==='high' && c.dueAt && !c.reminded && now >= c.dueAt);
  }
  function checkReminders(){
    const due = dueHighCards();
    if (!due.length) return;
    due.forEach(c => c.reminded = true);
    save(LS.cards, cards);
    playReminder();
    document.title = '(!) Påminnelse – OrderPrio';
    const body = due.length + ' högprio-kort väntar: ' + due.map(c=>c.order).join(', ');
    if (settings.delivery === 'system' && 'Notification' in window && Notification.permission === 'granted') {
      try {
        const n = new Notification('OrderPrio – påminnelse', { body, tag:'orderprio-reminder' });
        n.onclick = () => { window.focus(); openReminder(due.map(c=>c.id)); };
      } catch(e){ openReminder(due.map(c=>c.id)); }
      toast('Påminnelse skickad som systemnotis', { icon:'bell-ring', action:{ label:'Visa', fn:()=>openReminder(due.map(c=>c.id)) }, timeout: 8000 });
    } else {
      openReminder(due.map(c=>c.id));
    }
    render();
  }
  function openReminder(ids){
    const list = ids ? cards.filter(c=>ids.includes(c.id)) : dueHighCards();
    if (!list.length && !ids) return;
    $('#reminderSub').textContent = list.length ? list.length + ' kort har nått sin påminnelsetid' : '';
    $('#reminderList').innerHTML = list.map(c => `
      <div class="px-5 py-3.5">
        <div class="flex items-center gap-2">
          <span class="font-mono text-sm font-bold text-rose-600 dark:text-rose-400">${esc(c.order)}</span>
          <span class="text-[11px] text-neutral-400">påminnelse kl ${fmtTime(c.dueAt)}</span>
        </div>
        ${c.action ? `<div class="text-sm mt-0.5">${esc(c.action)}</div>` : ''}
        <div class="flex gap-2 mt-2">
          <button class="btn-primary !py-1 !px-3 !text-xs !bg-emerald-600 hover:!bg-emerald-500" onclick="App.reminderDone('${c.id}')"><i data-lucide="check" class="h-3.5 w-3.5"></i>Klarmarkera</button>
          <button class="btn-ghost !py-1 !px-3 !text-xs" onclick="App.snoozeCard('${c.id}')"><i data-lucide="alarm-clock" class="h-3.5 w-3.5"></i>Påminn igen om 15 min</button>
        </div>
      </div>`).join('');
    const m = $('#reminderModal'); m.classList.remove('hidden'); m.classList.add('flex');
    refreshIcons();
  }
  function reminderDone(id){ moveCard(id, 'done'); refreshReminderModal(id); }
  function snoozeCard(id){
    const c = cards.find(x=>x.id===id); if(!c) return;
    c.dueAt = Date.now() + 15*60000; c.reminded = false;
    commit();
    toast('Påminnelse snoozad 15 min – ' + c.order, { icon:'alarm-clock', timeout: 3000 });
    refreshReminderModal(id);
  }
  function refreshReminderModal(){
    // håll modalen öppen bara om det finns kvarvarande påminda kort som ännu är högprio
    const still = cards.filter(c => c.status==='high' && c.reminded);
    if (!still.length) { closeReminder(); return; }
    openReminder(still.map(c=>c.id));
  }
  function closeReminder(){ const m=$('#reminderModal'); m.classList.add('hidden'); m.classList.remove('flex'); document.title='OrderPrio – Håll koll på jobbet'; }
  function testReminder(){
    if (settings.delivery === 'system' && 'Notification' in window) {
      ensureNotifPerm().then(ok => {
        if (ok) try { new Notification('OrderPrio – testpåminnelse', { body:'Så här ser en systemnotis ut. Ljudet spelas samtidigt.' }); } catch(e){}
        else toast('Systemnotiser är blockerade – visar på sidan istället', { icon:'triangle-alert' });
      });
    }
    playReminder();
    const sample = cards.find(c=>c.status==='high') || { id:'test', order:'TEST-12345', action:'Exempelåtgärd – så här ser en påminnelse ut', dueAt: Date.now() };
    if (sample.id === 'test') {
      $('#reminderSub').textContent = 'Detta är en testpåminnelse';
      $('#reminderList').innerHTML = `<div class="px-5 py-3.5">
        <div class="font-mono text-sm font-bold text-rose-600 dark:text-rose-400">${esc(sample.order)}</div>
        <div class="text-sm mt-0.5">${esc(sample.action)}</div></div>`;
      const m = $('#reminderModal'); m.classList.remove('hidden'); m.classList.add('flex');
    } else {
      openReminder([sample.id]);
      $('#reminderSub').textContent = 'Detta är en testpåminnelse (visar ditt äldsta högprio-kort)';
    }
    refreshIcons();
  }
  async function ensureNotifPerm(){
    if (!('Notification' in window)) return false;
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') return false;
    try { return (await Notification.requestPermission()) === 'granted'; } catch(e){ return false; }
  }

  /* ---------- Rendering ---------- */
  function render(){
    renderHeader(); renderComposer(); renderLists(); renderDone(); renderSettings(); renderAuth();
    refreshIcons();
  }

  function renderHeader(){
    $('#levelText').textContent = 'Nivå ' + level();
    const prog = stats.totalDone % 3;
    $('#levelDots').innerHTML = [0,1,2].map(i=>`<span class="h-1.5 w-1.5 rounded-full ${i<prog?'bg-amber-500':'bg-amber-300/40 dark:bg-amber-500/20'}"></span>`).join('');
    $('#levelChip').title = stats.totalDone + ' avklarade totalt · ' + (3-prog) + ' kvar till nivå ' + (level()+1);
    const dark = document.documentElement.classList.contains('dark');
    $('#themeIcon').innerHTML = `<i data-lucide="${dark?'sun':'moon'}" class="h-5 w-5"></i>`;
    $('#sortBtn').innerHTML = `<i data-lucide="${ui.sortDesc?'arrow-down-wide-narrow':'arrow-up-narrow-wide'}" class="h-3.5 w-3.5"></i> ${ui.sortDesc?'Nyast först':'Äldst först'}`;
    // Filterchips
    const hq = activeCards().filter(c=>c.status==='high' && matches(c, ui.query)).length;
    const lq = activeCards().filter(c=>c.status==='low' && matches(c, ui.query)).length;
    const chips = [['all','Alla', hq+lq],['high','Hög', hq],['low','Låg', lq]];
    $('#filterChips').innerHTML = chips.map(([k,l,n]) => {
      const on = ui.filter===k;
      const cls = k==='high' ? (on?'border-rose-500 bg-rose-500 text-white':'border-neutral-300 dark:border-neutral-700 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10')
               : k==='low' ? (on?'border-sky-500 bg-sky-500 text-white':'border-neutral-300 dark:border-neutral-700 text-sky-500 hover:bg-sky-50 dark:hover:bg-sky-500/10')
               : (on?'border-indigo-500 bg-indigo-600 text-white':'border-neutral-300 dark:border-neutral-700 text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800');
      return `<button class="chip ${cls}" onclick="App.setFilter('${k}')">${l} <span class="opacity-70">${n}</span></button>`;
    }).join('');
    // Vy-knappar
    const segOn = 'bg-indigo-600 text-white', segOff = 'text-neutral-500 dark:text-neutral-400 hover:text-neutral-800 dark:hover:text-neutral-100';
    $('#viewSplitBtn').className = 'seg-btn ' + (settings.view==='split'?segOn:segOff);
    $('#viewAllBtn').className = 'seg-btn ' + (settings.view==='all'?segOn:segOff);
    $('#splitView').classList.toggle('hidden', settings.view!=='split');
    $('#allView').classList.toggle('hidden', settings.view!=='all');
    $('#clearSearch').classList.toggle('hidden', !ui.query);
  }

  function prioBadge(p){
    return p==='high'
      ? '<span class="rounded-full bg-rose-100 dark:bg-rose-500/15 text-rose-600 dark:text-rose-400 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide">Hög</span>'
      : '<span class="rounded-full bg-sky-100 dark:bg-sky-500/15 text-sky-600 dark:text-sky-400 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide">Låg</span>';
  }

  function cardHTML(c){
    if (c.id === ui.editingId) return editCardHTML(c);
    const col = prioColor(c.status==='high'?'high':'low');
    const isHigh = c.status==='high';
    const reminded = isHigh && c.reminded;
    return `
    <article class="group relative rounded-xl border border-neutral-200 dark:border-neutral-700/70 border-l-4 ${isHigh?'border-l-rose-500':'border-l-sky-500'} bg-neutral-50/60 dark:bg-neutral-800/40 p-3 ${reminded?'remind-flash':''}" data-id="${c.id}">
      <div class="flex items-center gap-2 flex-wrap">
        <button class="font-mono text-sm font-bold ${isHigh?'text-rose-600 dark:text-rose-400':'text-sky-600 dark:text-sky-400'} hover:underline cursor-copy select-text" title="Klicka för att kopiera ordernumret" onclick="App.copyOrder('${c.id}', this)">${esc(c.order)}</button>
        ${prioBadge(c.status)}
        ${reminded ? '<span class="flex items-center gap-1 rounded-full bg-rose-600 text-white px-2 py-0.5 text-[10px] font-bold"><i data-lucide="bell-ring" class="h-3 w-3"></i>Påmind!</span>' : ''}
        <span class="ml-auto text-[11px] text-neutral-400 dark:text-neutral-500 whitespace-nowrap" title="Skapad"><i data-lucide="calendar" class="inline h-3 w-3 -mt-0.5 mr-0.5"></i>${fmtDT(c.createdAt)}</span>
      </div>
      ${c.action ? `<div class="mt-1.5 text-sm font-semibold select-text">${esc(c.action)}</div>` : ''}
      ${c.note ? `<div class="mt-1 text-sm text-neutral-600 dark:text-neutral-400 whitespace-pre-wrap break-words select-text">${esc(c.note)}</div>` : ''}
      <div class="mt-2.5 flex items-center gap-1 flex-wrap">
        ${isHigh && c.dueAt ? `<span class="text-[11px] font-medium ${c.reminded?'text-rose-500':'text-neutral-400 dark:text-neutral-500'} mr-auto flex items-center gap-1"><i data-lucide="alarm-clock" class="h-3 w-3"></i>${c.reminded?'Påmind':'Påminn'} ${fmtTime(c.dueAt)}</span>` : '<span class="mr-auto"></span>'}
        ${isHigh
          ? `<button class="card-action" title="Flytta till låg prioritet" onclick="App.moveCard('${c.id}','low')"><i data-lucide="arrow-down" class="h-3.5 w-3.5"></i>Låg</button>`
          : `<button class="card-action" title="Flytta till hög prioritet" onclick="App.moveCard('${c.id}','high')"><i data-lucide="arrow-up" class="h-3.5 w-3.5"></i>Hög</button>`}
        <button class="card-action !text-emerald-600 dark:!text-emerald-400" title="Klarmarkera" onclick="App.moveCard('${c.id}','done')"><i data-lucide="check" class="h-3.5 w-3.5"></i>Klar</button>
        <button class="card-action" title="Redigera" onclick="App.startEdit('${c.id}')"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
        <button class="card-action hover:!text-red-500" title="Radera" onclick="App.deleteCard('${c.id}')"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
      </div>
    </article>`;
  }

  function editCardHTML(c){
    const isHigh = c.status==='high';
    return `
    <article class="rounded-xl border-2 border-indigo-400 dark:border-indigo-500/60 bg-white dark:bg-neutral-800 p-3 space-y-2" data-id="${c.id}">
      <div class="grid sm:grid-cols-2 gap-2">
        <div><label class="label">Ordernummer</label><input id="e-order-${c.id}" class="inp font-mono" value="${esc(c.order)}"></div>
        <div><label class="label">Åtgärd</label><input id="e-action-${c.id}" class="inp" value="${esc(c.action)}"></div>
      </div>
      <div><label class="label">Anteckning</label><textarea id="e-note-${c.id}" class="inp" rows="2">${esc(c.note)}</textarea></div>
      ${c.status!=='done' ? `
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex rounded-lg border border-neutral-300 dark:border-neutral-700 p-0.5 gap-0.5">
          <button class="seg-btn e-prio ${isHigh?'bg-rose-500 text-white':'text-neutral-500'}" data-p="high" onclick="App.editPrio('${c.id}','high',this)">Hög</button>
          <button class="seg-btn e-prio ${!isHigh?'bg-sky-500 text-white':'text-neutral-500'}" data-p="low" onclick="App.editPrio('${c.id}','low',this)">Låg</button>
        </div>
        <div class="e-remind flex items-center gap-1 ${isHigh?'':'hidden'}">
          <span class="text-[11px] font-semibold text-neutral-400 mr-1">Påminn om:</span>
          ${[15,30,60,120].map(m=>`<button class="chip e-rem !px-2 ${m===(c.remindIn||60)?'border-indigo-500 bg-indigo-600 text-white':'border-neutral-300 dark:border-neutral-700 text-neutral-500'}" data-m="${m}" onclick="App.editRemind('${c.id}',${m},this)">${m<60?m+' m':m/60+' h'}</button>`).join('')}
        </div>
      </div>` : ''}
      <div class="flex gap-2 pt-1">
        <button class="btn-primary !py-1.5 !text-xs" onclick="App.saveEdit('${c.id}')"><i data-lucide="check" class="h-3.5 w-3.5"></i>Spara</button>
        <button class="btn-ghost !py-1.5 !text-xs" onclick="App.cancelEdit()">Avbryt</button>
      </div>
    </article>`;
  }

  function emptyHTML(msg, icon){
    return `<div class="py-8 text-center">
      <i data-lucide="${icon}" class="h-8 w-8 mx-auto text-neutral-300 dark:text-neutral-600"></i>
      <p class="mt-2 text-xs font-medium text-neutral-400 dark:text-neutral-500">${esc(msg)}</p>
    </div>`;
  }

  function renderLists(){
    const act = activeCards().filter(c => matches(c, ui.query));

    const low = sortCards(act.filter(c=>c.status==='low' && ui.filter!=='high'), 'createdAt');
    $('#countHigh').textContent = high.length;
    $('#countLow').textContent = low.length;
    // I delad vy: dölj kolumn om filter
    const cols = document.querySelectorAll('#splitView > section');
    if (cols.length===2){
      cols[0].style.display = ui.filter==='low' ? 'none' : '';
      cols[1].style.display = ui.filter==='high' ? 'none' : '';
      $('#splitView').classList.toggle('md:grid-cols-2', ui.filter==='all');
      $('#splitView').classList.toggle('md:grid-cols-1', ui.filter!=='all');
    }
    $('#listHigh').innerHTML = high.length ? high.map(cardHTML).join('') : emptyHTML(ui.query ? 'Inga träffar bland högprio' : 'Inga högprio-kort – lugnt läge', 'coffee');
    $('#listLow').innerHTML = low.length ? low.map(cardHTML).join('') : emptyHTML(ui.query ? 'Inga träffar bland lågprio' : 'Inga lågprio-kort', 'inbox');
    const all = sortCards(act.filter(c=>ui.filter==='all'||c.status===ui.filter), 'createdAt');
    $('#countAll').textContent = all.length;
    $('#listAll').innerHTML = all.length ? all.map(cardHTML).join('') : emptyHTML(ui.query ? 'Inga träffar' : 'Inga aktiva kort – allt avklarat!', 'party-popper');

    $('#countDone').textContent = done.length;

    $('#doneChevron').setAttribute('data-lucide', ui.doneOpen ? 'chevron-up' : 'chevron-down');

      return `

      setTimeout(()=>{ if(confirmArmed[key]){ confirmArmed[key]=false; renderSettings(); } }, 4000);

  function shortcutList(){
    const rows = [['N','Nytt kort'],['Esc','Stäng ruta / avbryt'],['/ eller Ctrl+K','Fokusera sök'],['T','Växla tema'],['V','Växla vy (fält/lista)'],['1 / 2 / 3','Filter: alla / hög / låg'],['A','Visa/dölj avklarat'],['?','Denna hjälp']];
    return '<div class="grid grid-cols-1 gap-1">' + rows.map(([k,d])=>`<div class="flex items-center gap-3 text-xs py-1"><kbd class="rounded border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-1.5 py-0.5 font-semibold min-w-8 text-center">${k}</kbd><span class="text-neutral-600 dark:text-neutral-400">${d}</span></div>`).join('') + '</div>';
  }

  /* ---------- Farozon ---------- */
  function danger(key){
    const fns = {
      delActive: () => arm(key,'', ()=>{ cards = cards.filter(c=>c.status==='done'); commit(); toast('Alla aktiva kort raderade', { icon:'trash-2', iconCls:'text-red-500' }); }),
      delDone: () => arm(key,'', ()=>{ cards = cards.filter(c=>c.status!=='done'); commit(); toast('Alla avklarade kort raderade', { icon:'trash-2', iconCls:'text-red-500' }); }),
      delAll: () => arm(key,'', ()=>{ cards = []; stats.totalDone = 0; commit(); toast('Allt har raderats – nystart!', { icon:'trash-2', iconCls:'text-red-500' }); }),
      import: () => arm(key,'', ()=>applyImport()),
    };
    if (fns[key]) fns[key]();
  }

  /* ---------- Export / Import ---------- */
  function exportData(){
    const data = { app:'OrderPrio', version:1, exportedAt: new Date().toISOString(), cards, stats, settings: { sound: settings.sound, volume: settings.volume, delivery: settings.delivery, mascot: settings.mascot, theme: settings.theme } };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'orderprio-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Backup exporterad (' + cards.length + ' kort)', { icon:'download', iconCls:'text-emerald-500' });
  }
  let pendingImport = null;
  function pickImport(){ $('#importFile').click(); }
  function handleImportFile(file){
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        const raw = Array.isArray(data) ? data : data.cards;
        if (!Array.isArray(raw) || !raw.length) throw new Error('inga kort');
        const clean = raw.filter(c => c && (c.order !== undefined)).map(c => ({
          id: String(c.id || uid()).replace(/'/g, '').trim() || uid(),
          order: String(c.order||''), action: String(c.action||''), note: String(c.note||''),
          status: ['high','low','done'].includes(c.status) ? c.status : 'low',
          prevStatus: ['high','low'].includes(c.prevStatus) ? c.prevStatus : null,
          createdAt: +c.createdAt || Date.now(), doneAt: c.doneAt ? +c.doneAt : null,
          remindIn: REM_OPTS.includes(+c.remindIn) ? +c.remindIn : 60,
          highSince: c.highSince ? +c.highSince : null,
          dueAt: c.dueAt ? +c.dueAt : null, reminded: !!c.reminded
        }));
        if (!clean.length) throw new Error('ogiltiga');
        pendingImport = { cards: clean, stats: data.stats && typeof data.stats.totalDone==='number' ? data.stats : null };
        renderSettings();
        toast('Filen läst – bekräfta importen i inställningarna', { icon:'file-check', timeout: 5000 });
      } catch(e) {
        toast('Kunde inte läsa filen – är det en OrderPrio-backup?', { icon:'triangle-alert', iconCls:'text-red-500', timeout: 5000 });
      }
    };
    r.readAsText(file);
  }
  function applyImport(){
    if (!pendingImport) return;
    cards = pendingImport.cards;
    if (pendingImport.stats) stats.totalDone = Math.max(0, pendingImport.stats.totalDone);
    pendingImport = null;
    commit();
    toast('Import klar – ' + cards.length + ' kort inlästa', { icon:'circle-check', iconCls:'text-emerald-500', timeout: 5000 });
  }

  /* ---------- Tema ---------- */
  function applyTheme(){
    const t = settings.theme;
    const dark = t==='dark' || (t==='system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
  }
  function toggleTheme(){
    const dark = document.documentElement.classList.contains('dark');
    settings.theme = dark ? 'light' : 'dark';
    applyTheme(); commit({stamp:false});
  }

  /* ---------- Autentisering & synk (brygga mot Firebase-modul) ---------- */
  function renderAuth(){
    const btn = $('#authBtn');
    if (authUser) {
      btn.innerHTML = `<span class="flex h-5 w-5 items-center justify-center rounded-full bg-indigo-600 text-white text-[10px] font-extrabold">${esc(authUser.email[0].toUpperCase())}</span><span class="hidden sm:inline max-w-28 truncate">${esc(authUser.email)}</span><span class="h-2 w-2 rounded-full bg-emerald-500" title="Synk aktiv"></span>`;
    } else {
      btn.innerHTML = `<i data-lucide="log-in" class="h-4 w-4"></i><span class="hidden sm:inline">Logga in</span>`;
    }
    refreshIcons();
  }
  function renderAuthSlot(){
    const slot = $('#settingsAuthSlot');
    if (!slot) return;
    if (authUser) {
      slot.innerHTML = `<div class="flex items-center gap-2 text-sm"><span class="h-2 w-2 rounded-full bg-emerald-500"></span><span class="font-semibold truncate">${esc(authUser.email)}</span><button class="ml-auto text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline cursor-pointer" onclick="App.toggleAuth(true)">Hantera</button></div>`;
    } else {
      slot.innerHTML = `<p class="text-xs text-neutral-400 mb-2">Korten sparas alltid lokalt. Logga in för att synka dem mellan enheter via Firebase.</p><button class="btn-primary w-full !py-1.5" onclick="App.toggleAuth(true)"><i data-lucide="log-in" class="h-4 w-4"></i> Logga in / skapa konto</button>`;
    }
  }
  function toggleAuth(open){
    const m = $('#authModal');
    if (!open) { m.classList.add('hidden'); m.classList.remove('flex'); return; }
    renderAuthModal();
    m.classList.remove('hidden'); m.classList.add('flex');
  }
  function renderAuthModal(err){
    const b = $('#authBody');
    if (authUser) {
      b.innerHTML = `
        <div class="rounded-xl bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/30 p-3 text-sm mb-4">
          <div class="flex items-center gap-2 font-semibold text-emerald-700 dark:text-emerald-400"><i data-lucide="circle-check" class="h-4 w-4"></i> Inloggad & synkad</div>
          <div class="text-xs text-emerald-600/80 dark:text-emerald-400/70 mt-0.5 truncate">${esc(authUser.email)}</div>
        </div>
        <p class="text-xs text-neutral-400 mb-4">Ändringar synkas automatiskt till molnet när du är inloggad. Senast lokalt uppdaterad: ${localStamp ? fmtDT(localStamp) : '–'}.</p>
        <button class="btn-ghost w-full" onclick="App.signOut()"><i data-lucide="log-out" class="h-4 w-4"></i> Logga ut</button>`;
    } else {
      b.innerHTML = `
        <p class="text-xs text-neutral-400 mb-4">Dina kort sparas alltid lokalt i webbläsaren. Logga in med e-post och lösenord för att även synka dem online (kräver att Firestore är aktiverat i ditt Firebase-projekt).</p>
        ${!window.Sync ? `<div class="rounded-lg bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 text-amber-700 dark:text-amber-400 text-xs p-2.5 mb-3">Synkmodulen kunde inte laddas (offline?). Lokal lagring fungerar ändå.</div>` : ''}
        ${err ? `<div class="rounded-lg bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/30 text-red-600 dark:text-red-400 text-xs p-2.5 mb-3">${esc(err)}</div>` : ''}
        <div class="space-y-2.5">
          <input id="authEmail" type="email" class="inp" placeholder="E-postadress" autocomplete="email">
          <input id="authPass" type="password" class="inp" placeholder="Lösenord (minst 6 tecken)" autocomplete="current-password">
        </div>
        <div class="grid grid-cols-2 gap-2 mt-4">
          <button class="btn-primary" onclick="App.signIn()"><i data-lucide="log-in" class="h-4 w-4"></i> Logga in</button>
          <button class="btn-ghost" onclick="App.signUp()"><i data-lucide="user-plus" class="h-4 w-4"></i> Skapa konto</button>
        </div>`;
      const p = $('#authPass'); if (p) p.addEventListener('keydown', e=>{ if(e.key==='Enter') signIn(); });
      setTimeout(()=>{ const e=$('#authEmail'); if(e) e.focus(); }, 30);
    }
    refreshIcons();
  }
  function authErr(e){
    const map = { 'auth/user-not-found':'Fel e-post eller lösenord', 'auth/wrong-password':'Fel e-post eller lösenord', 'auth/invalid-credential':'Fel e-post eller lösenord', 'auth/email-already-in-use':'E-posten används redan – logga in istället', 'auth/weak-password':'Lösenordet måste vara minst 6 tecken', 'auth/invalid-email':'Ogiltig e-postadress', 'auth/too-many-requests':'För många försök – vänta en stund', 'auth/network-request-failed':'Nätverksfel – kontrollera uppkopplingen' };
    return map[e && e.code] || ('Fel: ' + (e && e.code ? e.code.replace('auth/','') : 'okänt'));
  }
  function signIn(){
    if (!window.Sync) return renderAuthModal('Synkmodulen är inte laddad');
    const e = $('#authEmail').value.trim(), p = $('#authPass').value;
    if (!e || !p) return renderAuthModal('Fyll i både e-post och lösenord');
    window.Sync.signIn(e,p).catch(err => renderAuthModal(authErr(err)));
  }
  function signUp(){
    if (!window.Sync) return renderAuthModal('Synkmodulen är inte laddad');
    const e = $('#authEmail').value.trim(), p = $('#authPass').value;
    if (!e || !p) return renderAuthModal('Fyll i både e-post och lösenord');
    window.Sync.signUp(e,p).catch(err => renderAuthModal(authErr(err)));
  }
  function signOut(){ if (window.Sync) window.Sync.signOut().then(()=>toast('Utloggad – lokalt läge', { icon:'log-out' })); }

  function onAuthChanged(user){
    authUser = user;
    renderAuth(); renderAuthSlot(); renderSettings();
    if (user) { toggleAuth(false); toast('Inloggad som ' + user.email + ' – synkar…', { icon:'cloud', timeout: 3000 }); }
    refreshIcons();
  }
  function applyRemote(data){
    if (Array.isArray(data.cards)) cards = data.cards;
    if (data.stats && typeof data.stats.totalDone === 'number') stats.totalDone = data.stats.totalDone;
    localStamp = data.updatedAt || Date.now();
    save(LS.cards, cards); save(LS.stats, stats); save('op.stamp.v1', localStamp);
    render();
    toast('Synk uppdaterad från molnet', { icon:'cloud-download', timeout: 2500 });
  }
  function syncError(e){
    if (syncMsgShown) return; syncMsgShown = true;
    toast('Molnsynk misslyckades – kontrollera att Firestore är aktiverat i Firebase-projektet', { icon:'cloud-off', iconCls:'text-amber-500', timeout: 7000 });
    setTimeout(()=>syncMsgShown=false, 60000);
  }

  /* ---------- Kortkommandon ---------- */
  function onKey(e){
    const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
    if (e.key === 'Escape') {
      if (!$('#reminderModal').classList.contains('hidden')) return closeReminder();
      if (!$('#authModal').classList.contains('hidden')) return toggleAuth(false);
      if (!$('#helpModal').classList.contains('hidden')) return toggleHelp(false);
      if (!$('#settingsOverlay').classList.contains('hidden')) return closeSettings();
      if (ui.editingId) return cancelEdit();
      if (ui.composerOpen) { ui.composerOpen = false; render(); return; }
      if (typing) { e.target.blur(); return; }
    }
    if (typing) return;
    if (e.ctrlKey || e.metaKey || e.altKey) {
      if ((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='k') { e.preventDefault(); $('#searchInput').focus(); }
      return;
    }
    switch (e.key) {
      case 'n': case 'N': e.preventDefault(); openComposer(); break;
      case '/': e.preventDefault(); $('#searchInput').focus(); break;
      case 't': case 'T': toggleTheme(); break;
      case 'v': case 'V': setView(settings.view==='split'?'all':'split'); break;
      case 'a': case 'A': toggleDone(); break;
      case '1': setFilter('all'); break;
      case '2': setFilter('high'); break;
      case '3': setFilter('low'); break;
      case '?': toggleHelp(!$('#helpModal').classList.contains('hidden') ? false : true); break;
    }
  }
  function toggleHelp(open){
    if (open) { $('#helpBody').innerHTML = shortcutList(); $('#helpModal').classList.remove('hidden'); $('#helpModal').classList.add('flex'); }
    else { $('#helpModal').classList.add('hidden'); $('#helpModal').classList.remove('flex'); }
    refreshIcons();
  }

  /* ---------- Diverse UI ---------- */
  function setFilter(f){ ui.filter = f; render(); }
  function setView(v){ settings.view = v; commit({stamp:false}); }
  function toggleSort(){ ui.sortDesc = !ui.sortDesc; render(); }
  function toggleDone(){ ui.doneOpen = !ui.doneOpen; renderDone(); refreshIcons(); }
  function clearQuery(){ ui.query = ''; $('#searchInput').value=''; render(); }
  function openComposer(){
    if (ui.composerOpen) { const o = $('#c-order'); if (o) o.focus(); return; }
    ui.composerOpen = true; render();
  }
  function closeComposer(){ ui.composerOpen = false; render(); }
  function composerPrio(p){ ui.composerPrio = p; paintComposer(p, ui.composerRemind || settings.lastRemind); }
  function composerRemind(m){ ui.composerRemind = m; paintComposer(ui.composerPrio || settings.lastPrio, m); }
  function setDelivery(d){
    settings.delivery = d; commit({stamp:false});
    if (d==='system') ensureNotifPerm().then(ok => { if(!ok) toast('Systemnotiser är inte tillåtna – tillåt dem i webbläsaren', { icon:'triangle-alert', iconCls:'text-amber-500', timeout: 5000 }); });
  }
  function setSound(k){ settings.sound = k; commit({stamp:false}); SOUNDS[k].play(); }
  function previewSound(k){ SOUNDS[k].play(); }
  function setVolume(v){
    settings.volume = v/100;
    const el = $('#volPct'); if (el) el.textContent = v + '%';
    save(LS.settings, settings);
    clearTimeout(setVolume._t); setVolume._t = setTimeout(()=>tone(880,0,.12,'sine',1), 120);
  }
  function setTheme(t){ settings.theme = t; applyTheme(); commit({stamp:false}); }
  function setMascot(on){ settings.mascot = on; commit({stamp:false}); if(on) showMascot(); }

  /* ---------- Init ---------- */
  function init(){
    applyTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(settings.theme==='system') applyTheme(); });
    $('#searchInput').addEventListener('input', e => { ui.query = e.target.value.trim(); render(); });
    $('#importFile').addEventListener('change', e => { if (e.target.files[0]) handleImportFile(e.target.files[0]); e.target.value=''; });
    document.addEventListener('keydown', onKey);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) { checkReminders(); if(document.title.startsWith('(!)')) document.title='OrderPrio – Håll koll på jobbet'; } });
    setInterval(checkReminders, 8000);
    setTimeout(checkReminders, 1200);
    render();
  }

  return {
    init, toggleTheme, toggleHelp, openSettings, closeSettings, danger,
    openComposer, closeComposer, composerPrio, composerRemind, submitComposer,
    moveCard, deleteCard, undoDone, copyOrder, startEdit, cancelEdit, saveEdit, editPrio, editRemind,
    setFilter, setView, toggleSort, toggleDone, clearQuery,
    setDelivery, setSound, previewSound, setVolume, setTheme, setMascot, testReminder,
    reminderDone, snoozeCard, closeReminder,
    exportData, pickImport,
    toggleAuth, signIn, signUp, signOut, onAuthChanged, applyRemote, syncError,
    getSyncState: () => ({ cards, stats, updatedAt: localStamp }),
    get localStamp(){ return localStamp; }
  };
})();

App.init();
</script>

<!-- ================= FIREBASE (auth + Firestore-synk) ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQD-MMCPPtcwrylM-y52fjnKIhbf58d9Y",
  authDomain: "remember2-465bc.firebaseapp.com",
  projectId: "remember2-465bc",
  storageBucket: "remember2-465bc.firebasestorage.app",
  messagingSenderId: "497511091722",
  appId: "1:497511091722:web:1a53ea92fec94a396199f3"
};

try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let uid = null, unsub = null;

  function push() {
    if (!uid) return;
    const state = window.App.getSyncState();
    setDoc(doc(db, 'users', uid), {
      cards: JSON.parse(JSON.stringify(state.cards)),
      stats: state.stats,
      updatedAt: state.updatedAt
    }).catch(e => window.App.syncError(e));
  }

  onAuthStateChanged(auth, user => {
    uid = user ? user.uid : null;
    if (unsub) { unsub(); unsub = null; }
    window.App.onAuthChanged(user ? { email: user.email, uid: user.uid } : null);
    if (user) {
      const ref = doc(db, 'users', user.uid);
      unsub = onSnapshot(ref, snap => {
        if (snap.exists()) {
          const d = snap.data();
          if (d.updatedAt && d.updatedAt > window.App.localStamp) window.App.applyRemote(d);
        } else {
          push(); // första inloggningen – ladda upp lokalt läge
        }
      }, err => window.App.syncError(err));
    }
  });

  window.Sync = {
    signIn: (e, p) => signInWithEmailAndPassword(auth, e, p),
    signUp: (e, p) => createUserWithEmailAndPassword(auth, e, p),
    signOut: () => signOut(auth),
    push
  };
} catch (e) {
  console.warn('Firebase kunde inte initieras:', e);
}
</script>
